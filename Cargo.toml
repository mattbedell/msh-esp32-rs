[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
edition      = "2024"
rust-version = "1.88"
version      = "0.1.0"

[workspace.dependencies]
esp-hal = { version = "~1.1.0", features = ["unstable"] }

esp-rtos = { version = "0.3.0", features = ["embassy"] }

esp-bootloader-esp-idf = { version = "0.5.0" }

embassy-executor = { version = "0.10.0" }
embassy-time     = { version = "0.5.0" }
panic-rtt-target = { version = "0.2.0" }
rtt-target       = { version = "0.6.2" }

critical-section = "1.2.0"
static_cell      = "2.1.1"
epd-waveshare = "0.6.0"
embedded-hal-bus = "0.3.0"
embedded-graphics = "0.8.2"
bbqueue = { version = "0.7.0", features = ["portable-atomic"] }
embassy-sync = "0.8.0"
micropb = { version = "0.6.0", features = ["container-heapless-0-9"] }
heapless = "0.9.3"

# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'
